# EN: Local disposable mod_php listener; only the public directory has an HTTP route.
#
# HR: Lokalni potrošni mod_php listener; samo javni direktorij ima HTTP putanju.
ServerName localhost
<VirtualHost *:8080>
    DocumentRoot /srv/simbioza-c5-acceptance/modphp/public
    <Directory /srv/simbioza-c5-acceptance/modphp/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
