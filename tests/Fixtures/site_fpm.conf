; EN: Dedicated disposable pools; no changes to installed system pools.
;
; HR: Zasebni potrošni poolovi; nema izmjena instaliranih sistemskih poolova.
[global]
pid = /srv/simbioza-c5-acceptance/run/fpm.pid
error_log = /srv/simbioza-c5-acceptance/run/fpm.log
daemonize = yes

[c5-normal]
user = www-data
group = www-data
listen = 127.0.0.1:19181
pm = static
pm.max_children = 1
clear_env = yes
env[HPH_APP_PATH] = /srv/simbioza-c5-acceptance/normal
env[HPH_CONFIG_PATH] = /srv/simbioza-c5-acceptance/normal/config
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120

[c5-secure]
user = www-data
group = www-data
listen = 127.0.0.1:19182
pm = static
pm.max_children = 1
clear_env = yes
env[HPH_APP_PATH] = /srv/simbioza-c5-acceptance/secure
env[HPH_CONFIG_PATH] = /srv/simbioza-c5-acceptance/secure-config
php_admin_value[open_basedir] = /srv/simbioza-c5-acceptance/secure:/srv/simbioza-c5-acceptance/secure-config:/tmp:/etc/ssl/certs:/usr/share/zoneinfo
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120
