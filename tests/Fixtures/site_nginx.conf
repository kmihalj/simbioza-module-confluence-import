# EN: Dedicated localhost listeners; never included in a public virtual host.
#
# HR: Zasebni localhost listeneri; ne uključuju se u javni virtualni host.
pid /srv/simbioza-c5-acceptance/run/nginx.pid;
error_log /srv/simbioza-c5-acceptance/run/nginx.log;
events {}
http {
    access_log /srv/simbioza-c5-acceptance/run/access.log;
    server {
        listen 127.0.0.1:18181;
        root /srv/simbioza-c5-acceptance/normal/public;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:19181;
        }
    }
    server {
        listen 127.0.0.1:18182;
        root /srv/simbioza-c5-acceptance/secure/public;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:19182;
        }
    }
}
